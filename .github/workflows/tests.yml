name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: memory-triage fixtures
        run: bash skills/memory-audit/scripts/test-memory-triage.sh
      - name: structural-check fixtures
        run: bash skills/memory-audit/scripts/test-structural-check.sh

  no-local-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail on machine-specific paths
        run: |
          if grep -rnE '/Users/|/home/[a-z]|/private/tmp/' --exclude-dir=.git --exclude-dir=.github .; then
            echo "Machine-specific paths found (listed above). Remove them before publishing."
            exit 1
          fi
